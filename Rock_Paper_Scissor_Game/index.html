<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock_Paper_Scissor_Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Rock, Paper And Scissor</h1>
    <!-- Choice Divs -->
    <div class="choices">
      <div class="choice" id="rock">
        <img src="./image/rock.png" alt="Rock image" />
      </div>
      <div class="choice" id="paper">
        <img src="./image/paper.png" alt="Rock image" />
      </div>
      <div class="choice" id="scissor">
        <img src="./image/scissor.png" alt="Rock image" />
      </div>
    </div>
    <!-- Score Board -->
    <div class="score-board">
      <div class="score">
        <p id="user-score">0</p>
        <p>You</p>
      </div>
      <div class="score">
        <p id="comp-score">0</p>
        <p>Comp</p>
      </div>
    </div>
    <div class="msg-container">
      <p id="msg">Play Your Move</p>
    </div>
    <script src="game.js"></script>
  </body>
</html>
